version: 2

models:
  - name: int_geolocation_by_zip
    description: One representative geographic record per ZIP-code prefix, calculated from distinct geolocation data.

    columns:
      - name: geolocation_zip_code_prefix
        description: Five-character ZIP-code prefix.
        data_tests:
          - not_null
          - unique

      - name: geolocation_latitude
        description: Median latitude across deduplicated ZIP observations.
        data_tests:
          - not_null

      - name: geolocation_longitude
        description: Median longitude across deduplicated ZIP observations.
        data_tests:
          - not_null

      - name: geolocation_city
        description: Most frequently observed city for the ZIP prefix.
        data_tests:
          - not_null

      - name: geolocation_state
        description: State associated with the representative city.
        data_tests:
          - not_null

      - name: distinct_observation_count
        description: Number of distinct geolocation observations used to calculate the representative ZIP record.
        data_tests:
          - not_null

  - name: int_order_items_by_order
    description: Order-item measures aggregated to one row per order to prevent row multiplication when joining.

    columns:
      - name: order_id
        description: Identifier of the order.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: item_count
        description: Number of item rows in the order.
        data_tests:
          - not_null

      - name: distinct_product_count
        description: Number of distinct products in the order.
        data_tests:
          - not_null

      - name: distinct_seller_count
        description: Number of distinct sellers in the order.
        data_tests:
          - not_null

      - name: item_price_total
        description: Total listed item value excluding freight.
        data_tests:
          - not_null

      - name: freight_value_total
        description: Total freight value across the order items.
        data_tests:
          - not_null

      - name: item_and_freight_total
        description: Combined item-price and freight value.
        data_tests:
          - not_null

      - name: earliest_shipping_limit_at
        description: Earliest item shipping deadline in the order.
        data_tests:
          - not_null

      - name: latest_shipping_limit_at
        description: Latest item shipping deadline in the order.
        data_tests:
          - not_null