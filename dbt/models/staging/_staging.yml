version: 2

models:
  - name: stg_orders
    description: Cleaned and typed order records at one row per order.

    columns:
      - name: order_id
        description: Unique identifier for an order.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Customer record associated with the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_status
        description: Current lifecycle status of the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - approved
                  - canceled
                  - created
                  - delivered
                  - invoiced
                  - processing
                  - shipped
                  - unavailable

      - name: order_purchase_at
        description: Timestamp when the order was placed.
        data_tests:
          - not_null

      - name: order_approved_at
        description: Timestamp when payment approval occurred.

      - name: order_delivered_carrier_at
        description: Timestamp when the order was handed to the carrier.

      - name: order_delivered_customer_at
        description: Timestamp when the customer received the order.

      - name: order_estimated_delivery_at
        description: Estimated customer-delivery timestamp.
        data_tests:
          - not_null

  - name: stg_customers
    description: Cleaned customer records at one row per customer ID.

    columns:
      - name: customer_id
        description: Order-specific customer identifier.
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: Identifier for customer across orders.
        data_tests:
          - not_null

      - name: customer_zip_code_prefix
        description: Five-character ZIP-code prefix for the customer.
        data_tests:
          - not_null

      - name: customer_city
        description: Customer city normalized to lowercase.
        data_tests:
          - not_null

      - name: customer_state
        description: Two-character Brazilian state code.
        data_tests:
          - not_null

  - name: stg_sellers
    description: Cleaned seller records at one row per seller ID.

    columns:
      - name: seller_id
        description: Unique identifier for a seller.
        data_tests:
          - not_null
          - unique

      - name: seller_zip_code_prefix
        description: Five-character ZIP-code prefix for the seller.
        data_tests:
          - not_null

      - name: seller_city
        description: Seller city normalized to lowercase.
        data_tests:
          - not_null

      - name: seller_state
        description: Two-character Brazilian state code.
        data_tests:
          - not_null

  - name: stg_products
    description: >
      Cleaned and typed product records at one row per product.

    columns:
      - name: product_id
        description: Unique identifier for a product.
        data_tests:
          - not_null
          - unique

      - name: product_category_name
        description: Product category name in Portuguese.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_product_category_translation')
                field: product_category_name
              config:
                severity: warn

      - name: product_name_length
        description: Number of characters in the product name.

      - name: product_description_length
        description: Number of characters in the product description.

      - name: product_photos_quantity
        description: Number of product photos.

      - name: product_weight_g
        description: Product weight in grams.

      - name: product_length_cm
        description: Product length in centimeters.

      - name: product_height_cm
        description: Product height in centimeters.

      - name: product_width_cm
        description: Product width in centimeters.

  - name: stg_product_category_translation
    description: Portuguese to English product category mapping, one row per
      Portuguese category.

    columns:
      - name: product_category_name
        description: Product category name in Portuguese.
        data_tests:
          - not_null
          - unique

      - name: product_category_name_english
        description: Product category name translated into English.
        data_tests:
          - not_null

  - name: stg_order_items
    description: Cleaned and typed order-item records, one row per order ID and order item ID.

    columns:
      - name: order_id
        description: Order containing the item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: order_item_id
        description: Sequence identifying the item within its order.
        data_tests:
          - not_null

      - name: product_id
        description: Product associated with the order item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: seller_id
        description: Seller associated with the order item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id

      - name: shipping_limit_at
        description: Seller shipping deadline for the order item.
        data_tests:
          - not_null

      - name: item_price
        description: Product price for the order item.
        data_tests:
          - not_null

      - name: freight_value
        description: Freight amount assigned to the order item.
        data_tests:
          - not_null

  - name: stg_order_payments
    description: Cleaned and typed payment records at one row per order ID and payment sequence.

    columns:
      - name: order_id
        description: Order associated with the payment component.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: payment_sequence
        description: Sequence identifying the payment component within an order.
        data_tests:
          - not_null

      - name: payment_type
        description: Method used for the payment component.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - boleto
                  - credit_card
                  - debit_card
                  - not_defined
                  - voucher

      - name: payment_installments
        description: Number of installments for the payment component.
        data_tests:
          - not_null

      - name: payment_value
        description: Monetary value of the payment component.
        data_tests:
          - not_null